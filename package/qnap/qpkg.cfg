# QDK build descriptor for the QNAP QPKG.
# Build with the helper script:  ./scripts/build-qnap-qpkg.sh <arch>
# The build script sets QPKG_VER and appends the version to QPKG_DISPLAY_NAME.
QPKG_NAME="PS3netsrvNG"
QPKG_DISPLAY_NAME="ps3netsrv"
QPKG_VER="0.0.0"
QPKG_AUTHOR="Hirador"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="ps3netsrv is a server application used to stream content from a remote server to the PS3."

# Preferred number in start/stop sequence.
QPKG_RC_NUM="101"
# Service control script (in shared/).
QPKG_SERVICE_PROGRAM="ps3netsrv-go.sh"

# Preserve the user's server config across upgrades.
QPKG_CONFIG="config.ini"

# Background daemon, no web UI.
QPKG_WEBUI=""
QPKG_WEB_PORT=""

# QTS 4.1.0+ (covers the 4.3.3 target).
QTS_MINI_VERSION="4.1.0"
