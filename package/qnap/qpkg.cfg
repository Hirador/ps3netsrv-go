# QDK build descriptor for the legacy-ARMv5 QNAP QPKG.
# Build with:  qbuild --build-dir <this dir>   (QDK on a Linux host)
QPKG_NAME="PS3netsrvNG"
QPKG_DISPLAY_NAME="PS3netsrv-go (ARMv5 static)"
QPKG_VER="0.0.0"
QPKG_AUTHOR="ps3netsrv-go contributors"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="PS3 network server (Go rewrite) - fully static build for legacy Kirkwood ARMv5 QNAP NAS (uClibc, QTS 4.x)."

# Increment so this replaces older installs cleanly.
QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="ps3netsrv-go.sh"

# Only meaningful on ARMv5 (Kirkwood) hardware.
QPKG_PLATFORM_1="TS-ARM-X19"

QPKG_DIR_ICONS="icons"
QPKG_DIR_SHARED="shared"
QPKG_DIR_CONFIG="config"

# No web UI; this is a background daemon.
QPKG_WEBUI=""
QPKG_WEB_PORT=""
