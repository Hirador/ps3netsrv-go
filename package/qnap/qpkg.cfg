# QDK build descriptor for the legacy-ARMv5 (Kirkwood, arm-x19) QNAP QPKG.
# Build with the helper script:  ./scripts/build-qnap-qpkg.sh
# or manually with QDK:          qbuild --build-arch arm-x19
QPKG_NAME="PS3netsrvNG"
QPKG_DISPLAY_NAME="PS3netsrv-go (ARMv5)"
QPKG_VER="0.0.0"
QPKG_AUTHOR="ps3netsrv-go contributors"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="PS3 network server (Go rewrite), fully static build for legacy Kirkwood ARMv5 QNAP NAS (uClibc, QTS 4.x)."

# Preferred number in start/stop sequence.
QPKG_RC_NUM="101"
# Service control script (in shared/).
QPKG_SERVICE_PROGRAM="ps3netsrv-go.sh"

# Preserve the user's server config across upgrades.
QPKG_CONFIG="config.ini"

# Background daemon, no web UI.
QPKG_WEBUI=""
QPKG_WEB_PORT=""

# QTS 4.1.0+ (covers the 4.3.3 target).
QTS_MINI_VERSION="4.1.0"
