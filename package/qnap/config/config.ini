[server]
# Directory shared with the PS3. Change this to your media share.
root = /share/PS3
# Refuse path traversal / outside-symlink access. Recommended.
strict-root = true
# Allow the PS3 to write back (e.g. remote install to NAS). Set false for read-only.
allow-write = true
# Listen on all interfaces, default PS3netsrv port.
listen-addr = 0.0.0.0:38008
